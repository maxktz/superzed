# Fork-specific CD pipeline (not generated by `cargo xtask workflows`).
#
# On every push to `superzed` or `main`: if the version in crates/zed/Cargo.toml
# changed in that push and no GitHub release exists for it yet, build unsigned
# bundles for macOS (aarch64), Linux (x86_64), and Windows (x86_64) on
# GitHub-hosted runners and publish them as release v<version>.
#
# `workflow_dispatch` skips the version-changed check (still skips if the
# release already exists) — use it to retry a failed release or backfill one.
name: superzed-release

on:
  push:
    branches:
      - superzed
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: superzed-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  # The workspace release profile (thin LTO + codegen-units=1) needs more RAM
  # than free GitHub-hosted runners have (7 GB on macOS arm64), and we never
  # upload debug symbols, so relax the profile via environment overrides.
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  # Compile-time kill switch for the auto-updater so fork builds never try to
  # replace themselves with upstream Zed releases from zed.dev.
  ZED_UPDATE_EXPLANATION: 'Superzed updates ship via GitHub Releases: https://github.com/o1x3/superzed/releases'

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Decide whether to release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(grep -m1 '^version = ' crates/zed/Cargo.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Could not read version from crates/zed/Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"

          release_exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          version_changed=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version_changed=true
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # New branch or unknown base: fall back to the release-exists check only.
            version_changed=true
          else
            old_version=$(gh api "repos/$GITHUB_REPOSITORY/contents/crates/zed/Cargo.toml?ref=$BEFORE_SHA" \
              --jq '.content' 2>/dev/null | base64 -d | grep -m1 '^version = ' | cut -d'"' -f2 || true)
            if [ -z "$old_version" ] || [ "$old_version" != "$version" ]; then
              version_changed=true
            fi
          fi

          should_release=false
          if [ "$release_exists" = false ] && [ "$version_changed" = true ]; then
            should_release=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version version_changed=$version_changed release_exists=$release_exists => should_release=$should_release"

  bundle-mac:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Set release channel to stable
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Bundle macOS app (aarch64)
        run: ./script/bundle-mac aarch64-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: Superzed-macos-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: superzed-remote-server-macos-aarch64.gz
          path: target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  bundle-linux:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    # 22.04 (glibc 2.35) instead of 24.04: glibc 2.38+ headers emit
    # __isoc23_* symbols into C objects, which then fail to link into the
    # static musl remote_server. An older build host also lowers the glibc
    # floor for users of the tarball.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - name: Set release channel to stable
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install clang 18
        # webrtc-sys needs clang 17+; Ubuntu 22.04 ships clang 14.
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Bundle Linux tarball (x86_64)
        run: ./script/bundle-linux
      - uses: actions/upload-artifact@v7
        with:
          name: superzed-linux-x86_64.tar.gz
          path: target/release/zed-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: superzed-remote-server-linux-x86_64.gz
          path: target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

  bundle-windows:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Enable git long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - name: Set release channel to stable
        run: Set-Content -Path crates/zed/RELEASE_CHANNEL -Value 'stable'
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }
          exit 0
      - name: Bundle Windows installer (x86_64)
        run: script/bundle-windows.ps1 -Architecture x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: SuperzedSetup-windows-x86_64.exe
          path: target/Zed-x86_64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: superzed-remote-server-windows-x86_64.zip
          path: target/zed-remote-server-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs:
      - detect
      - bundle-mac
      - bundle-linux
      - bundle-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          mv artifacts/Superzed-macos-aarch64.dmg/Zed-aarch64.dmg release-assets/Superzed-macos-aarch64.dmg
          mv artifacts/superzed-linux-x86_64.tar.gz/zed-linux-x86_64.tar.gz release-assets/superzed-linux-x86_64.tar.gz
          mv artifacts/SuperzedSetup-windows-x86_64.exe/Zed-x86_64.exe release-assets/SuperzedSetup-windows-x86_64.exe
          mv artifacts/superzed-remote-server-macos-aarch64.gz/zed-remote-server-macos-aarch64.gz release-assets/superzed-remote-server-macos-aarch64.gz
          mv artifacts/superzed-remote-server-linux-x86_64.gz/zed-remote-server-linux-x86_64.gz release-assets/superzed-remote-server-linux-x86_64.gz
          mv artifacts/superzed-remote-server-windows-x86_64.zip/zed-remote-server-windows-x86_64.zip release-assets/superzed-remote-server-windows-x86_64.zip
          ls -l release-assets/
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Superzed $VERSION" \
              --generate-notes \
              release-assets/*
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
